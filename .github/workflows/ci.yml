name: CI

# Gatekeeper: every push and pull request must pass the full standard
# (code style -> static analysis -> tests) before it is valid for review.
on:
  push:
    branches: ['**']   # every version line (0.1, 0.2, …) and every feature branch
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    # NO DATABASE SERVICE. This bundle owns no entity and remembers nothing;
    # every assertion it makes is about markup or about the stylesheet it ships.

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      # update, not install: a library is tested against the versions its
      # constraints allow, and the lock file is not committed.
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Code style (php-cs-fixer)
        run: composer cs:check

      - name: Static analysis (PHPStan max)
        run: composer phpstan

      # The suite includes the stylesheet conformance check, which reads the
      # COMMITTED public/element.css. CI deliberately does NOT run
      # `composer css:build`: the built sheet is a reviewed artefact, so a build
      # that would have changed it must fail here rather than quietly ship.
      - name: Tests (PHPUnit)
        run: composer test
